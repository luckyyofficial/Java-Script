     <!-- 6. 3 ways to define variables in java script -->
     <script>
        
        // 1. Using var keyword
        
        var variable1 = "value1";
        // Values can be changed and updated using var keyword. It is function-scoped, meaning it is accessible within the function it is defined in.
        // can't be declared again within the same function or block scope. It can be re-declared and updated within the same function or block scope.
        
        // 2. Using let keyword
        
         let variable2 = "value2";
        // Values can be changed and updated using let keyword. It is block-scoped, meaning it is only accessible within the block it is defined in.
        // can't be declared again within the same block scope. It can be updated but not re-declared within the same block scope.
        
        // 3. Using const keyword
        
        const variable3 = "value3";
        // Values cannot be changed or updated using const keyword. It is block-scoped, meaning it is only accessible within the block it is defined in.
        // can't be declared again within the same block scope. It cannot be updated or re-declared within the same block scope.
        
        //  The var keyword is function-scoped, while let and const are block-scoped 
     
     </script>

     <!-- Objects in JavaScript -->
     
     <script>
         const person = {  // here we are creating an object called person using the const keyword. 
         // The object has three properties: firstName, lastName, and age.
             firstName: "John",
             lastName: "Doe",
             age: 30
         };
         person["firstName"] = "Jane"; // here we are changing the value of the firstName property from John to Jane using bracket notation.
         person.age = 31; // here we are changing the value of the age property from 30 to 31 using dot notation.
         
         console.log(person); //  used to display the entire object in the console.
         console.log(person.firstName); // used to display the value of the firstName property in the console.
         console.log(person.lastName); // used to display the value of the lastName property in the console.
         console.log(person.age); // used to display the value of the age property in the console.
     
     </script> 

     <script>

        // Operators in JavaScript
        // Used to perform operations on variables and values. 
        // There are different types of operators in JavaScript, including arithmetic, assignment, comparison, logical, and more.

        // Modulus operator (%)
        let x = 10;
        let y = 3;
        let result = x % y; //  The modulus operator returns the remainder of a division
        console.log(result); //  Output: 1

        // Exponentiation operator (**)
        let base = 2;
        let exponent = 3;
        let power = base ** exponent; //  The exponentiation operator raises the base to the power of the exponent ( a ** b = a raised to the power of b)
        console.log(power); //  Output: 8

        // Increment operator (++)
        let num = 5;
        
        console.log(+num);
        console.log(num++);
        console.log(++num);

        // Increment operator (++)
        let numb = 5;
        
        console.log(-numb);
        console.log(numb--);
        console.log(--numb);
     
     </script>
  
     <script>

    // JavaScript Assignment Operators
    // Used to assign values to variables
 
    // 1. Basic Assignment (=)
    
    let a = 10;
    console.log("= :", a); // Output: 10

    // 2. Addition Assignment (+=) -> a = a + 5
    let b = 10;
    b += 5;
    console.log("+= :", b); // Output: 15

    // 3. Subtraction Assignment (-=) -> c = c - 4
    let c = 10;
    c -= 4;
    console.log("-= :", c); // Output: 6

    // 4. Multiplication Assignment (*=) -> d = d * 3
    let d = 10;
    d *= 3;
    console.log("*= :", d); // Output: 30

    // 5. Remainder / Modulus Assignment (%=) -> e = e % 3
    let e = 10;
    e %= 3;
    console.log("%= :", e); // Output: 1

    // 6. Exponentiation Assignment (**=) -> f = f ** 3
    let f = 2;
    f **= 3;
    console.log("**= :", f); // Output: 8

    </script>

    <script>

{

    // Comparison Operators

    // == : This ' == ' sign in js is used to compare 2 numbers , they are equal or not .

    // ==========================================
    // Equality Operator (==) in JavaScript
    // Compares two values to check if they are equal
    // Returns true if equal, false if not
    // Note: It converts types automatically if they differ (loose equality)
    // ==========================================

    // 1. Comparing equal numbers
    let a = 10;
    let b = 10;
    console.log(a == b); // Output: true

    // 2. Comparing different numbers
    let x = 10;
    let y = 5;
    console.log(x == y); // Output: false

    // 3. Loose equality (number vs string number)
    let num = 10;
    let str = "10";
    console.log(num == str); // Output: true (values match after type conversion)
  
    // 4. Using in an if condition
    let score = 50;
    if (score == 50) {
    console.log("You passed!"); // Output: You passed!
    
    }

    // ==========================================
    // Comparison Operators in JavaScript
    // Used to compare two values and return a boolean (true or false)
    // ==========================================
 
    // ------------------------------------------
    // 1. Strict Equality (===)
    // Compares both value AND data type (no type conversion)
    // ------------------------------------------
    
    let num1 = 10;
    let num2 = 10;
    let strNum = "10";

    console.log(num1 === num2);   // Output: true  (same value and type)
    console.log(num1 === strNum); // Output: false (different type: number vs string)


    // ------------------------------------------
    // 2. Inequality (!=) [Loose Inequality]
    // Checks if two values are NOT equal (converts types if needed)
    // ------------------------------------------
    
    let p = 10;
    let q = 20;

    console.log(p != q);    // Output: true  (10 is not equal to 20)
    console.log(10 != "10"); // Output: false (values match after conversion)


    // ------------------------------------------
    // 3. Strict Inequality (!==)
    // Checks if values OR types are NOT equal
    // ------------------------------------------
    
    console.log(10 !== 20);   // Output: true  (values are different)
    console.log(10 !== "10"); // Output: true  (types are different)
    console.log(10 !== 10);   // Output: false (exact match in value and type)


    // ------------------------------------------
    // 4. Greater Than (>)
    // Checks if the left value is greater than the right value
    // ------------------------------------------
    
    let age = 18;

    console.log(age > 15); // Output: true
    console.log(age > 20); // Output: false
    console.log(age > 18); // Output: false (it is equal, not strictly greater)


    // ------------------------------------------ 
    // 5. Less Than (<)
    // Checks if the left value is smaller than the right value
    // ------------------------------------------
    let speed = 60;

    console.log(speed < 80); // Output: true
    console.log(speed < 40); // Output: false
    console.log(speed < 60); // Output: false (it is equal, not strictly less)


    // ------------------------------------------
    // 6. Greater Than or Equal To (>=)
    // Checks if the left value is greater than OR equal to the right value
    // ------------------------------------------
      
    let passingScore = 40;

    console.log(passingScore >= 40); // Output: true  (matches the equal condition)
    console.log(passingScore >= 50); // Output: false
    console.log(passingScore >= 35); // Output: true


    // ------------------------------------------
    // 7. Less Than or Equal To (<=)
    // Checks if the left value is less than OR equal to the right value
    // ------------------------------------------
    
    let balance = 100;

    console.log(balance <= 100); // Output: true  (matches the equal condition)
    console.log(balance <= 150); // Output: true 
    console.log(balance <= 50);  // Output: false


}

    </script>
